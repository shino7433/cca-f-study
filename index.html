<!DOCTYPE html>
<html lang="ja">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>CCA-F 演習 | Claude Certified Architect – Foundations</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;600;700;800;900&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <div class="app">
      <!-- ===== ホーム / Overview ===== -->
      <section id="view-home" class="view active">
        <div id="home-area"></div>
      </section>

      <!-- ===== 演習 ===== -->
      <section id="view-quiz" class="view">
        <header class="screen-head">
          <h1 class="screen-title">演習</h1>
          <p class="screen-sub">本番形式の選択式で解く</p>
        </header>
        <div class="controls">
          <div class="control">
            <span class="control-label">ドメイン</span>
            <select id="f-domain">
              <option value="ALL">すべて</option>
            </select>
          </div>
          <div class="control">
            <span class="control-label">出題範囲</span>
            <select id="f-filter">
              <option value="all">全問</option>
              <option value="unanswered">未回答だけ</option>
              <option value="wrong">間違えた問題だけ</option>
            </select>
          </div>
          <div class="control">
            <span class="control-label">順番</span>
            <select id="f-order">
              <option value="random">ランダム</option>
              <option value="sequential">順番</option>
            </select>
          </div>
          <button class="btn-primary" id="btn-start">この条件で始める</button>
          <span class="progress-line" id="progress-line"></span>
        </div>
        <div id="quiz-area"></div>
      </section>

      <!-- ===== 単語 ===== -->
      <section id="view-vocab" class="view">
        <header class="screen-head">
          <h1 class="screen-title">頻出単語</h1>
          <p class="screen-sub">全問題から集めた重要英単語</p>
        </header>
        <div id="vocab-area"></div>
      </section>
    </div>

    <!-- ===== 下部ナビ ===== -->
    <nav class="bottom-nav">
      <button class="nav-item active" data-view="home">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M3 10.5 12 3l9 7.5" /><path d="M5 9.5V20a1 1 0 0 0 1 1h4v-6h4v6h4a1 1 0 0 0 1-1V9.5" /></svg>
        <span>ホーム</span>
      </button>
      <button class="nav-item" data-view="quiz">
        <svg viewBox="0 0 24 24" aria-hidden="true"><rect x="4" y="4" width="16" height="16" rx="4" /><path d="m8.5 12 2.5 2.5 4.5-5" /></svg>
        <span>演習</span>
      </button>
      <button class="nav-item" data-view="vocab">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M5 4h11a2 2 0 0 1 2 2v14H7a2 2 0 0 1-2-2Z" /><path d="M18 20a2 2 0 0 0 2-2V6" /><path d="M9 8h6M9 12h4" /></svg>
        <span>単語</span>
      </button>
    </nav>

    <script src="questions.js"></script>
    <script src="app.js"></script>
  </body>
</html>
